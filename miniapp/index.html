<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🃏 Lucky Card Draw</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* CRITICAL: Override position:fixed with absolute inside a full-size wrapper */
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0f0f1a;
    }
    #app-root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    /* Screens use position:absolute inside #app-root (fixes Telegram WebView iframe bug) */
    .screen {
      display: none !important;
      position: absolute !important;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%; height: 100%;
    }
    .screen.active {
      display: flex !important;
    }
    /* Win overlay uses absolute too */
    #winOverlay {
      position: absolute !important;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 1000;
    }
    /* Toast stays near bottom */
    #toast {
      position: absolute !important;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
    }
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app-root">

<!-- ══════ LOADING ══════ -->
<div id="loadingScreen" class="screen active">
  <div class="loading-center">
    <div class="logo-anim">🃏</div>
    <h1>Lucky Card Draw</h1>
    <div class="spinner"></div>
    <p id="loadingMsg">Connecting...</p>
  </div>
</div>

<!-- ══════ NOT REGISTERED ══════ -->
<div id="registerScreen" class="screen">
  <div class="center-content">
    <div class="big-icon">📝</div>
    <h2>Register First</h2>
    <p>You need to register before playing.<br>
       Go to the bot and send <strong>/register</strong></p>
    <button class="btn btn-primary" onclick="openBot()">↗ Open Bot</button>
  </div>
</div>

<!-- ══════ MAIN SCREEN ══════ -->
<div id="mainScreen" class="screen" style="flex-direction:column; overflow:hidden;">

  <!-- HEADER -->
  <header class="header">
    <div class="header-left">
      <div class="header-name" id="headerName">Player</div>
      <div class="header-balance">
        💳 <span id="headerBalance">0.00</span> Birr
        &nbsp;·&nbsp;
        🪙 <span id="headerCoins">0</span>
      </div>
    </div>
    <div class="header-right">
      <button class="icon-btn" onclick="refreshAll()" id="refreshBtn" title="Refresh">🔄</button>
      <button class="icon-btn" onclick="openBot()" title="Open Bot">💬</button>
    </div>
  </header>

  <!-- TABLE TABS BAR -->
  <div class="tabs-bar">
    <div class="tabs-scroll" id="tabsBar">
      <button class="tab-btn active" id="tab-btn-all" onclick="switchTab('all')">
        <span class="tab-icon">📋</span> All Tables
      </button>
      <!-- Table 1-5 tabs injected by JS -->
    </div>
  </div>

  <!-- ── ALL-TABLES OVERVIEW PANEL ── -->
  <div class="table-panel active" id="panel-all">
    <div class="overview-header">
      <div class="overview-title">🃏 Choose a Table</div>
      <div class="overview-sub">Join multiple tables and play simultaneously!</div>
    </div>
    <div id="overviewCards"></div>
  </div>

  <!-- ── PER-TABLE PANELS ── -->
  <div id="tablesContainer"></div>

</div><!-- /mainScreen -->

<!-- TOAST -->
<div id="toast" class="toast hidden"></div>

<!-- WIN POPUP -->
<div id="winOverlay" class="win-overlay hidden" onclick="closeWinOverlay()">
  <div class="win-box" onclick="event.stopPropagation()">
    <div class="win-confetti" id="winConfetti"></div>
    <div class="win-emoji" id="winEmoji">🥇</div>
    <div class="win-title" id="winTitle">You Won!</div>
    <div class="win-amount" id="winAmount">+0 Birr</div>
    <div class="win-table" id="winTable">Table 1</div>
    <button class="btn btn-gold" onclick="closeWinOverlay()">Awesome! 🎉</button>
  </div>
</div>

</div><!-- /app-root -->

<script src="game.js"></script>
</body>
</html>
